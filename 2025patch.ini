; Rec Room 2025 patch configuration. Applied at injection.
; Delete a line (or the whole file) to fall back to the built-in defaults.

[config]

; Backend hosts. Bare host names -- no scheme, no path.
; ApiHost rewrites ns.rec.net in the game's API requests.
ApiHost=ns.recflare.net
; PhotonHost is the DNS target for Photon (*.photonengine / exitgames / photonindustries).
PhotonHost=photon.recflare.net

; false = self-hosted Photon (PhotonHost above). true = real Photon Cloud: the DNS
; redirect is skipped and the CloudAppId* values below are used instead.
UsePhotonCloud=false

; Self-hosted only. Port of the initial Photon connect; 0 = leave the supplied port.
PhotonPort=0

; Debug console window. Costs load time -- it steals focus and Unity throttles while
; unfocused. Everything it prints is already in 2025patch.log.
EnableConsole=false

; Fail third-party telemetry/analytics host lookups (RudderStack, Statsig, Backtrace,
; Unity cloud) instantly. Most are still live, so this also keeps an archival session's
; telemetry and crash dumps from reaching unrelated companies. Do not add recflare hosts.
BlockDeadHosts=true

; Verbose diagnostic tracing: request-pump probes, Photon operation/event tracers,
; HttpClient paths, BestHTTP responses. Chatty; only needed when investigating.
EnableTracing=false

; Photon Cloud only (UsePhotonCloud=true). Empty = keep the server-supplied value.
CloudAppIdRealtime=8f322bdb-2b1f-4c27-a232-01436f43d14e
CloudAppIdVoice=6b4682e1-a1a9-4e04-b44a-6db0049a4df3
CloudAppIdChat=55fae86e-0459-4f97-bf6c-39c9341da6ef
; e.g. us -- empty lets the client pick a region via the name server.
CloudFixedRegion=
